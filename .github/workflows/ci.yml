name: Test and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-xmi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-interoperability.txt
      - run: python -m scripts.verify_independent_xmi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: independent-xmi-evidence
          path: .build-tmp/independent-xmi
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m unittest discover -s tests -v
      - run: python generate_uml.py --version all && git diff --exit-code -- Uml UML.py Uml241
      - run: python semantic_report.py && git diff --exit-code -- semantic-report.json umltools/data/validation-obligations.json
      - run: python conformance_backlog.py && git diff --exit-code -- conformance-backlog.json CONFORMANCE_BACKLOG.md
      - run: python structural_audit.py && git diff --exit-code -- structural-audit.json STRUCTURAL_AUDIT.md
      - run: python -m scripts.report_uml241_audit && git diff --exit-code -- uml241-common-values-audit.json
      - run: python -m scripts.report_uml241_complete_audit && git diff --exit-code -- uml241-audit.json
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - name: Verify installed wheel outside checkout
        run: |
          cp scripts/smoke_install.py "$RUNNER_TEMP/smoke_install.py"
          cd "$RUNNER_TEMP"
          python smoke_install.py
