name: Publish release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - name: Check tag against package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c "import os,tomllib; v=tomllib.load(open('pyproject.toml','rb'))['project']['version']; assert os.environ['RELEASE_TAG'] == 'v'+v, 'Tag/package version mismatch'"
      - run: python -m unittest discover -s tests -v
      - run: python generate_uml.py && git diff --exit-code -- Uml UML.py
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - name: Verify installed distribution
        run: |
          cp scripts/smoke_install.py "$RUNNER_TEMP/smoke_install.py"
          cd "$RUNNER_TEMP"
          python smoke_install.py
      - run: python semantic_report.py && git diff --exit-code -- semantic-report.json
      - name: Publish versioned download assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "UmlLib $RELEASE_TAG"
